{{- $currentType := ""}}
{{- range $i, $v := .}}
{{- if or (ne (deref .FileType) $currentType) (eq $i 0)}}
{{- if ne $i 0}}</div>{{end -}}
<div class="type-container ftc{{or .FileTypeColor 0}}">
	{{- if ne (deref .FileType) ""}}
	<div class="type-title">{{.FileType}}</div><hr>
	{{- end}}
	{{- $currentType = (deref .FileType)}}
	{{- end}}
	<div data-file_id="{{.ID}}" data-name="{{.Name}}" data-mimetype="{{.MimeType}}" data-size="{{.Size}}" class="file-item">
		<a href="../file/{{.ID}}">{{.Name}}</a>
		({{.FormattedSize}})
	</div>
{{- end}}
</div>
